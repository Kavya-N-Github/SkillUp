<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>

    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
        }
    </style>
</head>

<body>

    <p>hello cuties</p>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Phone Number</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>John</td>
                <td>25</td>
                <td>9876543210</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
