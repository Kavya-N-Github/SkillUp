<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>

    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
        }
    </style>
</head>

<body>

    <p>hello cuties</p>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Phone Number</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>John</td>
                <td>25</td>
                <td>9876543210</td>
            </tr>
        </tbody>
    </table>
    <script>
        let a=0,b=1;

function fibonacci(n){
  for(let i=0;i<n;i++){
    console.log(a);
    let c= a+b;
    a=b;
    b=c;
  
  }
}
//console.log(fibonacci(10)); // gives undefined at the end bcoz function don't have any return statement and we are calling it to print therefore remove console.log here
fibonacci(10);
    </script>
</body>
</html>
